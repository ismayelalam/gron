name: 🐛 Bug Report
description: Report a bug to help us improve gron
title: '[Bug]: '
labels: ['bug', 'triage']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        Please search [existing issues](https://github.com/ismayelalam/gron/issues) before creating a new one.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Create scheduler with `gron.NewScheduler(...)`
        2. Register job with `s.NewJob(...)`
        3. Start scheduler with `s.Start()`
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include logs, stack traces, or panic messages.
  - type: input
    id: go-version
    attributes:
      label: Go Version
      placeholder: e.g., 1.21.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g., macOS 14.2, Ubuntu 22.04, Windows 11
  - type: textarea
    id: code
    attributes:
      label: Minimal Reproducible Example
      description: If possible, provide a short Go code snippet that triggers the bug.
      render: go
