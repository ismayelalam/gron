name: 💡 Feature Request
description: Suggest an idea or enhancement for gron
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: 'Thanks for suggesting an improvement! Please fill out the fields below.'
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like. Include API examples if possible.
      placeholder: |
        I would like to add `gron.WithMetrics()` so that...
        ```go
        s, _ := gron.NewScheduler(gron.WithMetrics(myPrometheusAdapter))
        ```
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Where would this change live?
      options:
        - Core Scheduler
        - Job Configuration
        - Cron Parser
        - Observability/Logging
        - Documentation
    validations:
      required: true
