name: Release

on:
  push:
    tags:
      - 'v*'

# Required permissions to create a GitHub Release
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/}

          # ✅ FIX: Use awk to cleanly extract the body of the changelog.
          # It starts printing after it sees "## [VERSION]" and stops when it sees the next "## [".
          # This completely avoids the "head -n -1" bug that deletes the last line of the file.
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md

          # Fallback if the changelog entry is missing or empty
          if [ ! -s release-notes.md ]; then
            echo "Release ${VERSION}" > release-notes.md
          fi

          # ✅ FIX: Use the modern, safe block syntax for multiline outputs
          {
            echo "notes<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
