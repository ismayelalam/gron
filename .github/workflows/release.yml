name: Release

on:
  workflow_run:
    workflows: ['Go CI'] # 👈 MUST exactly match the `name:` at the top of your CI workflow file
    types:
      - completed

# Required permissions to create a GitHub Release
permissions:
  contents: write

jobs:
  release:
    if: >-
      ${{ 
        github.event.workflow_run.conclusion == 'success' && 
        startsWith(github.event.workflow_run.head_branch, 'v') 
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Extract changelog section
        id: changelog
        env:
          VERSION: ${{ github.event.workflow_run.head_branch }} # e.g., v1.0.2
        run: |
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md

          # Fallback if the changelog entry is missing or empty
          if [ ! -s release-notes.md ]; then
            echo "Release ${VERSION}" > release-notes.md
          fi

          # Safe multiline output
          {
            echo "notes<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
